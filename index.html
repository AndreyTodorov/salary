<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Gross-to-Net Calculator 2026</title>
<meta name="description" content="Gross-to-net salary calculator for Germany, tax year 2026, including a 13th monthly salary, summer bonus and benefit cards. Based on the official BMF payroll tax algorithm.">
<meta property="og:type" content="website">
<meta property="og:title" content="German Gross-to-Net Calculator 2026">
<meta property="og:description" content="Net pay, taxes and social contributions for employees in Germany, including a 13th monthly salary. Based on the official BMF payroll tax algorithm.">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 15 L6 10 L10 8 L15 2' fill='none' stroke='%230E7A5C' stroke-width='2.5'/%3E%3Ccircle cx='10' cy='8' r='2.5' fill='%23E0A12B'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("fonts/archivo-latin.woff2") format("woff2");
    font-weight: 300 800; font-stretch: 62% 125%; font-style: normal; font-display: swap;
  }
  :root {
    --paper: #EEF1EE; --surface: #FBFCFA; --field: #F3F5F2; --ink: #1C2A28; --muted: #5A6865; --line: #D6DDD8; --edit: #7F8B87;
    --net: #0E7A5C; --tax: #7D4A73; --social: #4C6A8C; --bonus: #E0A12B; --bonus-ink: #8A5A00;
    --flash: rgba(14, 122, 92, .22); --ring: rgba(14, 122, 92, .28); --shadow: 0 1px 2px rgba(28, 42, 40, .06), 0 8px 24px -16px rgba(28, 42, 40, .25);
    --radius: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1614; --surface: #182220; --field: #121B18; --ink: #E3EAE6; --muted: #93A29D; --line: #2B3834; --edit: #6E7B77;
      --net: #43C497; --tax: #C990BD; --social: #8FAAD0; --bonus: #F0B94A; --bonus-ink: #F0B94A;
      --flash: rgba(67, 196, 151, .22); --ring: rgba(67, 196, 151, .35); --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif; font-size: 1rem; line-height: 1.5;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 74rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .print-only { display: none; }
  .noscript { margin: 1rem; padding: 1rem; border-left: 3px solid var(--tax); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--net); outline-offset: 2px; }

  /* Masthead */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .brand { min-width: 0; }
  h1 { margin: 0; font-size: 1.375rem; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
  .lede { margin: .15rem 0 0; color: var(--muted); font-size: .9375rem; max-width: 60ch; }
  .top-actions { display: flex; gap: .5rem; align-items: center; flex: none; }
  .btn {
    display: inline-flex; align-items: center; gap: .4rem; min-height: 2.25rem; padding: .35rem .8rem;
    font: inherit; font-size: .875rem; font-weight: 600; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--edit); }
  .btn svg { width: 1rem; height: 1rem; flex: none; }
  .btn.done { color: var(--net); border-color: var(--net); }
  h2 { font-size: 1.0625rem; font-weight: 650; margin: 0 0 1rem; }
  h3 { font-size: .9375rem; font-weight: 600; margin: 0 0 .6rem; }
  h3 small, h2 small { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; }

  /* Sticky result bar on phones */
  .sticky-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; gap: 1.25rem; padding: .5rem 1rem;
    background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: .875rem; color: var(--muted); transform: translateY(-100%); transition: transform .2s ease;
  }
  .sticky-bar b { color: var(--ink); font-weight: 650; font-stretch: 80%; font-size: 1rem; }
  .sticky-bar .net b { color: var(--net); }
  .sticky-bar.show { transform: translateY(0); }

  /* Layout */
  .layout {
    display: grid; gap: 1.25rem; margin-top: 1.5rem;
    grid-template-areas: "results" "settings" "details";
  }
  .results { grid-area: results; display: grid; gap: 1.25rem; min-width: 0; }
  .details { grid-area: details; display: grid; gap: 1.25rem; min-width: 0; }
  .settings { grid-area: settings; min-width: 0; }
  @media (min-width: 900px) {
    .layout {
      grid-template-columns: 19rem minmax(0, 1fr); column-gap: 2rem;
      grid-template-areas: "settings results" "settings details";
    }
    .settings { position: sticky; top: 1rem; align-self: start; max-height: calc(100vh - 2rem); overflow-y: auto; padding-right: .25rem; }
    .sticky-bar { display: none; }
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); min-width: 0; }

  /* Editable figures */
  .cellbox {
    position: relative; display: flex; align-items: baseline; gap: .35rem; min-width: 0;
    padding: .3rem .7rem .3rem .6rem; background: var(--field); border: 1px solid var(--line); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s, background-color .6s ease;
  }
  .cellbox:hover { border-color: var(--edit); }
  .cellbox:focus-within { border-color: var(--net); box-shadow: 0 0 0 3px var(--ring); }
  .cellbox.invalid { border-color: var(--tax); }
  .cellbox.invalid:focus-within { box-shadow: 0 0 0 3px rgba(125, 74, 115, .25); }
  .cellbox.flash, .out.flash { background-color: var(--flash); transition: none; }
  .cellbox .unit { color: var(--muted); font-weight: 500; font-size: 1rem; flex: none; }
  .cell {
    display: block; flex: 1; width: 100%; min-width: 0; padding: 0; margin: 0;
    font: inherit; font-size: 1.5rem; font-weight: 640; font-stretch: 72%; line-height: 1.3;
    text-align: right; color: var(--ink); background: transparent; border: 0; border-radius: 0;
  }
  input.cell { cursor: text; }
  input.cell:focus { outline: none; }
  .cell.net, .cellbox.net .cell { color: var(--net); }
  .pin {
    position: absolute; top: -.6rem; right: .6rem; padding: .05rem .5rem; border-radius: 999px;
    background: var(--net); color: #fff; font-size: .6875rem; font-weight: 650; line-height: 1.5; letter-spacing: .01em;
  }
  @media (prefers-color-scheme: dark) { .pin { color: #0F1614; } }
  .msg { display: block; margin: .35rem 0 0; color: var(--tax); font-size: .8125rem; }
  .out { display: block; padding: .3rem 0; font-size: 1.5rem; font-weight: 640; font-stretch: 72%; line-height: 1.3; text-align: right; transition: background-color .6s ease; border-radius: 6px; }
  .out.net { color: var(--net); }

  /* Hero */
  .hero { display: grid; gap: 1rem 2rem; grid-template-columns: minmax(0, 1fr); align-items: end; }
  .hero > div { min-width: 0; }
  .hero label, .tile .k { display: block; font-size: .875rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
  .hero .cellbox .cell { font-size: clamp(1.75rem, 6vw, 2.25rem); }
  .hero .hero-net .cellbox { padding: .4rem .9rem .4rem .8rem; }
  .hero .hero-net .cell { font-size: clamp(2.75rem, 11vw, 4.25rem); line-height: 1.15; font-weight: 700; font-stretch: 70%; }
  .hero .hero-net .unit { font-size: 1.25rem; }
  .hero-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; margin: 0; padding: .3rem .75rem; border-radius: 999px;
    background: var(--flash); color: var(--net); font-size: .875rem; font-weight: 600;
  }
  @media (prefers-color-scheme: light) { .chip { color: #0A5C45; } }
  .benefit-line { margin: 0; color: var(--muted); font-size: .875rem; }
  @media (min-width: 560px) {
    .hero { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  }

  /* Tiles */
  .tiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); }
  .tile { padding: 1rem 1rem 1.1rem; }
  .tile .row { margin-top: .6rem; }
  .tile .row .k { margin: 0 0 .25rem; font-size: .8125rem; }
  .tile .cellbox { padding: .2rem .6rem; }
  .tile .cell, .tile .out { font-size: 1.3rem; }
  .tile .out { padding: .2rem 0; }
  .tile.bonus h3 { color: var(--bonus-ink); }

  /* Share bar */
  .share { margin: 0 0 1.25rem; }
  .bar { display: flex; height: .9rem; border-radius: 999px; overflow: hidden; background: var(--line); }
  .bar span { display: block; height: 100%; min-width: 2px; transition: width .4s ease; }
  .bar .s-net { background: var(--net); }
  .bar .s-tax { background: var(--tax); }
  .bar .s-social { background: var(--social); }
  .share-legend { display: flex; flex-wrap: wrap; gap: .35rem 1.25rem; margin: .6rem 0 0; padding: 0; list-style: none; font-size: .875rem; color: var(--muted); }
  .share-legend b { color: var(--ink); font-weight: 650; }
  .share-legend li::before { content: ""; display: inline-block; width: .6rem; height: .6rem; border-radius: 2px; margin-right: .45rem; vertical-align: .05em; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .share-legend .l-net::before { background: var(--net); }
  .share-legend .l-tax::before { background: var(--tax); }
  .share-legend .l-social::before { background: var(--social); }

  /* Breakdown table */
  .table-scroll { overflow-x: auto; margin: 0 -1.25rem; padding: 0 1.25rem; }
  .breakdown table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9375rem; }
  .breakdown th, .breakdown td { padding: .55rem 0 .55rem .75rem; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .breakdown th:first-child { text-align: left; padding-left: 0; white-space: normal; min-width: 9rem; }
  .breakdown tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); padding-right: .6rem; hyphens: auto; }
  .breakdown thead th { font-weight: 500; color: var(--muted); }
  .breakdown thead th.bonus-col { color: var(--bonus-ink); }
  .breakdown tbody th { font-weight: 450; }
  .breakdown tbody th::before { content: ""; display: inline-block; width: .6rem; height: .6rem; border-radius: 2px; margin-right: .5rem; vertical-align: .05em; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .breakdown .gross th::before { display: none; }
  .breakdown .tax th::before { background: var(--tax); }
  .breakdown .social th::before { background: var(--social); }
  .breakdown .net th, .breakdown .net td, .breakdown .total th, .breakdown .total td { font-weight: 700; color: var(--net); }
  .breakdown .net th::before, .breakdown .total th::before { background: var(--net); }
  .breakdown .benefit th::before { background: transparent; border: 1px dashed var(--net); }
  .breakdown .total th, .breakdown .total td, .breakdown tr:last-child th, .breakdown tr:last-child td { border-bottom: 0; }
  .notes { margin: 1rem 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .875rem; }
  .notes li { padding-left: .9rem; border-left: 3px solid var(--bonus); margin-bottom: .5rem; }
  .assumptions { margin-top: 1rem; font-size: .875rem; color: var(--muted); }
  .assumptions summary { cursor: pointer; font-weight: 600; color: var(--ink); font-size: .9375rem; padding: .6rem 0; }
  .assumptions ul { margin: .25rem 0 0; padding-left: 1.1rem; max-width: 70ch; }
  .assumptions li { margin-bottom: .4rem; }

  /* Gross → net curve */
  .curve { margin: 0; position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; margin: 0 0 .5rem; font-size: .8125rem; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 1.4rem; border-top: 2.5px solid var(--net); vertical-align: middle; margin-right: .45rem; }
  .legend .avg::before { border-top: 2px dashed var(--bonus-ink); }
  .readout { display: none; min-height: 1.5rem; margin: 0 0 .5rem; font-size: .875rem; color: var(--muted); }
  .readout b { color: var(--ink); font-weight: 650; }
  .curve svg { display: block; width: 100%; overflow: visible; cursor: crosshair; touch-action: pan-y; }
  .curve svg text { font-family: inherit; font-size: 12px; fill: var(--muted); }
  .curve .grid line { stroke: var(--line); }
  .curve .cap line { stroke: var(--social); stroke-dasharray: 2 4; }
  .curve .cap text { fill: var(--social); font-size: 11px; }
  .curve .line-month { fill: none; stroke: var(--net); stroke-width: 2.5; stroke-linejoin: round; }
  .curve .line-avg { fill: none; stroke: var(--bonus-ink); stroke-width: 2; stroke-dasharray: 6 4; }
  .curve .you line, .curve .hover line { stroke: var(--muted); stroke-dasharray: 3 3; }
  .curve .you circle { fill: var(--net); stroke: var(--surface); stroke-width: 3; }
  .curve .hover { display: none; }
  .curve .hover.show { display: inline; }
  .curve .hover circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .tip {
    position: absolute; z-index: 2; pointer-events: none; white-space: pre; line-height: 1.4;
    background: var(--ink); color: var(--paper); font-size: .8125rem; padding: .45rem .6rem; border-radius: 6px;
    transform: translate(-50%, calc(-100% - 14px));
  }
  .curve figcaption { margin-top: .6rem; color: var(--muted); font-size: .9375rem; max-width: 62ch; }
  .curve figcaption .hint { display: block; font-size: .8125rem; margin-top: .2rem; }
  @media (max-width: 519px) {
    .readout { display: block; }
    .tip { display: none !important; }
  }

  /* Settings */
  .group { margin: 0 0 1.25rem; border: 0; padding: 0; min-width: 0; }
  .group > legend {
    width: 100%; padding: 0 0 .4rem; margin-bottom: .75rem; border-bottom: 1px solid var(--line);
    font-size: .8125rem; font-weight: 650; color: var(--muted);
  }
  .subfields { margin: -.25rem 0 1rem; padding-left: .75rem; border-left: 2px solid var(--bonus); }
  .field { margin: 0 0 1rem; border: 0; padding: 0; min-width: 0; }
  .field > label, .field > legend { display: block; font-weight: 600; font-size: .9375rem; margin-bottom: .4rem; padding: 0; }
  .sub { color: var(--muted); font-size: .8125rem; margin: .35rem 0 0; }
  select, input.text {
    width: 100%; min-height: 2.75rem; padding: .5rem .65rem; font: inherit; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 10px;
  }
  select:hover, input.text:hover { border-color: var(--edit); }
  select:focus-visible, input.text:focus-visible { outline: none; border-color: var(--net); box-shadow: 0 0 0 3px var(--ring); }
  .affix { position: relative; }
  .affix input { padding-right: 2.4rem; }
  .affix span { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .segmented { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--field); }
  .segmented label { flex: 1; display: flex; position: relative; text-align: center; cursor: pointer; }
  .segmented label + label { border-left: 1px solid var(--line); }
  .segmented input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .segmented span { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 2.6rem; padding: .35rem .25rem; font-weight: 600; font-size: .9375rem; }
  .segmented input:checked + span { background: var(--ink); color: var(--paper); }
  .segmented input:focus-visible + span { outline: 2px solid var(--net); outline-offset: -4px; }
  .segmented label.disabled { cursor: not-allowed; }
  .segmented label.disabled span { opacity: .35; }
  .segmented input:disabled { cursor: not-allowed; }
  .lang { flex: none; width: 6.5rem; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
  .lang span { min-height: 2.1rem; padding: .25rem; font-size: .8125rem; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 2.75rem; cursor: pointer; font-weight: 600; font-size: .9375rem; }
  .switch input { appearance: none; width: 3rem; height: 1.75rem; border-radius: 1rem; background: var(--edit); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.35rem; height: 1.35rem; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .switch input:checked { background: var(--net); }
  .switch input:checked::after { transform: translateX(1.25rem); }
  .switch.bonus input:checked { background: var(--bonus); }
  @media (min-width: 600px) and (max-width: 899px) {
    .settings form { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.5rem; align-items: start; }
    .settings h2 { grid-column: 1 / -1; }
  }

  footer { margin-top: 3rem; color: var(--muted); font-size: .8125rem; max-width: 70ch; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
  @media print {
    :root {
      --paper: #fff; --surface: #fff; --field: #fff; --ink: #000; --muted: #444; --line: #bbb; --edit: #999; --flash: transparent; --ring: transparent; --shadow: none;
      --net: #0E7A5C; --tax: #7D4A73; --social: #4C6A8C; --bonus: #E0A12B; --bonus-ink: #8A5A00; color-scheme: light;
    }
    .page { padding: 0; max-width: none; }
    .top-actions, .sticky-bar, .settings, .tip, .readout, .curve .hover, .curve .hint, .noscript, .pin, .msg { display: none !important; }
    .print-only { display: block; margin: 0 0 1rem; font-size: .875rem; }
    .layout { display: block; margin-top: 1rem; }
    .layout > *, .results > *, .details > * { margin-bottom: 1rem; break-inside: avoid; }
    .card { box-shadow: none; }
    .hero .hero-net .cell { font-size: 2rem; }
    .bar span, .share-legend li::before, .breakdown tbody th::before { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    @page { margin: 14mm; }
  }
</style>
</head>
<body>
<noscript><p class="noscript">This calculator needs JavaScript. Dieser Rechner benötigt JavaScript.</p></noscript>
<div class="sticky-bar" id="stickyBar" aria-hidden="true">
  <span><span data-i18n="gross"></span> <b id="barGross"></b></span>
  <span class="net"><span data-i18n="net"></span> <b id="barNet"></b></span>
</div>
<div class="page">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">German gross-to-net calculator 2026</h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn" id="copyLink">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2L7.5 4.3"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0L3.2 8.6a3 3 0 0 0 4.2 4.2l1.1-1.1"/></svg>
        <span id="copyLinkText" data-i18n="copyLink"></span>
      </button>
      <div class="segmented lang" role="radiogroup" aria-label="Language / Sprache">
        <label><input type="radio" name="lang" value="en" lang="en" aria-label="English"><span>EN</span></label>
        <label><input type="radio" name="lang" value="de" lang="de" aria-label="Deutsch"><span>DE</span></label>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="results" aria-labelledby="figures-title">
      <h2 id="figures-title" class="sr-only" data-i18n="figuresTitle"></h2>
      <p class="print-only" id="printSummary"></p>

      <div class="hero card" id="hero">
        <div class="hero-gross">
          <label for="monthlyGross" data-i18n="heroGross"></label>
          <div class="cellbox" data-cell="monthlyGross"></div>
        </div>
        <div class="hero-net">
          <label for="monthlyNet" data-i18n="heroNet"></label>
          <div class="cellbox net" data-cell="monthlyNet"></div>
        </div>
        <div class="hero-foot">
          <p class="chip" id="keepChip"></p>
          <p class="benefit-line" id="benefitLine" hidden></p>
        </div>
      </div>

      <div class="tiles">
        <div class="tile card" data-extra>
          <h3><span data-i18n="rowAvg"></span><small data-i18n="rowAvgSub"></small></h3>
          <div class="row"><label class="k" for="averageGross" data-i18n="gross"></label><div class="cellbox" data-cell="averageGross"></div></div>
          <div class="row"><label class="k" for="averageNet" data-i18n="net"></label><div class="cellbox net" data-cell="averageNet"></div></div>
        </div>
        <div class="tile card bonus" data-summer>
          <h3><span id="summerRowLabel"></span><small data-i18n="rowSummerSub"></small></h3>

    `<label><input type="radio" name="taxClass" value="${n}"><span>${n}</span></label>`).join('');
  $('breakdownBody').innerHTML = ROWS.map(([k, kind]) =>
    `<tr class="${kind}" data-row="${k}"><th scope="row"></th><td data-col="regular"></td><td data-col="summer" data-summer></td><td data-col="bonus" data-bonus></td><td data-col="year"></td></tr>`).join('');

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    for (const el of cells) el.setAttribute('aria-label', cap(t('cell_' + el.dataset.field)));
    document.querySelectorAll('.pin').forEach((el) => { el.textContent = t('pin'); el.title = t('pinHelp'); });
    form.querySelectorAll('[name=taxClass]').forEach((r) => r.setAttribute('aria-label', `${t('taxClass')} ${r.value}`));
    form.state.innerHTML = T.STATES.map(([c, en, de]) => `<option value="${c}">${lang === 'de' ? de : en}</option>`).join('');
    form.state.value = settings.state;
    form.children.options[0].textContent = t('childrenNone');
    form.summerMonth.innerHTML = [4, 5, 6, 7, 8, 9, 10].map((m) => `<option value="${m}">${monthName(m)}</option>`).join('');
    form.summerMonth.value = String(settings.summerMonth);
    $('assumptionList').innerHTML = '';
    for (const k of ['a1', 'a2', 'a3', 'a4', 'a5']) {
      const li = document.createElement('li');
      li.textContent = t(k);
      $('assumptionList').appendChild(li);
    }
    document.querySelector(`[name=lang][value="${lang}"]`).checked = true;
  }

  function writeForm() {
    form.thirteenth.checked = settings.thirteenth;
    form.church.checked = settings.church;
    form.querySelector(`[name=taxClass][value="${settings.taxClass}"]`).checked = true;
    form.querySelector(`[name=insurance][value="${settings.insurance}"]`).checked = true;
    form.state.value = settings.state;
    form.age.value = settings.age;
    form.children.value = String(settings.children);
    form.zusatzbeitrag.value = String(settings.zusatzbeitrag).replace('.', ',');
    form.privatePremium.value = fmt(settings.privatePremium);
    form.benefitCard.value = fmt(settings.benefitCard);
    form.summerBonus.checked = settings.summerBonus;
    form.querySelector(`[name=summerMode][value="${settings.summerMode}"]`).checked = true;
    form.summerPercent.value = String(settings.summerPercent);
    form.summerAmount.value = fmt(settings.summerAmount);
    form.summerMonth.value = String(settings.summerMonth);
  }

  function readForm() {
    const num = (v, fallback) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : fallback; };
    const amount = (v, fallback, max) => { const c = T.parseAmount(v); return c === null ? fallback : Math.min(c, max); };
    const next = {
      thirteenth: form.thirteenth.checked,
      church: form.church.checked,
      taxClass: Number(form.querySelector('[name=taxClass]:checked').value),
      insurance: form.querySelector('[name=insurance]:checked').value,
      state: form.state.value,
      age: Math.min(99, Math.max(15, Math.round(num(form.age.value, settings.age)))),
      children: Number(form.children.value),
      zusatzbeitrag: Math.round(Math.min(10, Math.max(0, num(form.zusatzbeitrag.value, settings.zusatzbeitrag))) * 100) / 100,
      privatePremium: amount(form.privatePremium.value, settings.privatePremium, 1000000),
      benefitCard: amount(form.benefitCard.value, settings.benefitCard, 100000),
      summerBonus: form.summerBonus.checked,
      summerMode: form.querySelector('[name=summerMode]:checked').value,
      summerPercent: Math.min(200, Math.max(0, Math.round(num(form.summerPercent.value, settings.summerPercent)))),
      summerAmount: amount(form.summerAmount.value, settings.summerAmount, 10000000),
      summerMonth: Number(form.summerMonth.value),
    };
    // A pinned average-month value disappears with the last extra payment: keep the matching monthly figure.
    const extras = (x) => x.thirteenth || x.summerBonus;
    if (extras(settings) && !extras(next) && anchor.field.startsWith('average') && lastResult) {
      const f = anchor.field.replace('average', 'monthly');
      anchor = { field: f, cents: T.read(lastResult, f) };
    }
    settings = T.normalize(next);
  }

  function grossFromAnchor() {
    return anchor.field === 'monthlyGross' ? Math.min(anchor.cents, T.MAX_GROSS) : T.solve(settings, anchor.field, anchor.cents);
  }

  // Writes a value and briefly tints its box so the change is visible.
  function setText(el, text, quiet) {
    const prop = el.tagName === 'INPUT' ? 'value' : 'textContent';
    if (el[prop] === text) return;
    el[prop] = text;
    if (quiet || reducedMotion.matches) return;
    const target = el.tagName === 'INPUT' ? boxOf(el) : el;
    target.classList.remove('flash');
    void target.offsetWidth;
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 250);
  }

  // Gross → net curve
  const PL = 54, PR = 14, PT = 20, PB = 30;
  let geo = null;

  function niceStep(range, count) {
    const raw = range / count;
    const p = 10 ** Math.floor(Math.log10(raw));
    return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
  }

  const keepAt = (g, net) => Math.round((T.calculate(settings, g + 10000).regular.net - net) / 100);

  function renderCurve() {
    const r = lastResult, gross = lastGross, on = settings.thirteenth || settings.summerBonus;
    const W = Math.max(280, Math.round(svg.getBoundingClientRect().width) || 640);
    const H = W < 520 ? 200 : 240;
    const xMax = Math.max(800000, Math.ceil(gross * 2 / 100000) * 100000);
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const g = Math.round(xMax * i / 80);
      const c = T.calculate(settings, g);
      pts.push([g, c.regular.net, c.average.net]);
    }
    const top = Math.max(1, ...pts.map((p) => (on ? Math.max(p[1], p[2]) : p[1])));
    const yStep = niceStep(top / 100, 4) * 100;
    const yMax = Math.ceil(top / yStep) * yStep;
    const xStep = niceStep(xMax / 100, W < 520 ? 3 : 5) * 100;
    const X = (g) => PL + g / xMax * (W - PL - PR);
    const Yp = (v) => H - PB - Math.max(0, v) / yMax * (H - PT - PB);
    const path = (i) => 'M' + pts.map((p) => `${X(p[0]).toFixed(1)},${Yp(p[i]).toFixed(1)}`).join('L');

    let s = '<g class="grid">';
    for (let v = 0; v <= yMax; v += yStep) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${Yp(v)}" y2="${Yp(v)}"/><text x="${PL - 8}" y="${Yp(v) + 4}" text-anchor="end">${whole.format(v / 100)}</text>`;
    }
    for (let g = 0; g <= xMax; g += xStep) {
      const anchorPos = g === 0 ? 'start' : g + xStep > xMax ? 'end' : 'middle';
      s += `<text x="${X(g)}" y="${H - PB + 18}" text-anchor="${anchorPos}">${whole.format(g / 100)}</text>`;
    }
    s += '</g>';
    // Cap labels sit on one line unless they would collide; a label near the right edge is anchored to its line's left.
    const crowded = X(Y.BBG_RV_MONTH) - X(Y.BBG_KV_MONTH) < 90;
    for (const [c, key, dy] of [[Y.BBG_KV_MONTH, 'capKV', 0], [Y.BBG_RV_MONTH, 'capRV', crowded ? 14 : 0]]) {
      if (c >= xMax) continue;
      const right = X(c) > W * 0.78;
      s += `<g class="cap"><line x1="${X(c)}" x2="${X(c)}" y1="${PT}" y2="${H - PB}"/><text x="${X(c) + (right ? -4 : 4)}" y="${PT - 6 + dy}" text-anchor="${right ? 'end' : 'start'}">${t(key)}</text></g>`;
    }
    if (on) s += `<path class="line-avg" d="${path(2)}"/>`;
    s += `<path class="line-month" d="${path(1)}"/>`;
    s += `<g class="you"><line x1="${X(gross)}" x2="${X(gross)}" y1="${Yp(r.regular.net)}" y2="${H - PB}"/><circle cx="${X(gross)}" cy="${Yp(r.regular.net)}" r="6"/></g>`;
    s += '<g class="hover"><line/><circle r="5"/></g>';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = s;
    $('tip').hidden = true;
    touchPick = null;
    svg.setAttribute('aria-label', t('curveAria', { gross: fmtEurC(gross), net: fmtEurC(r.regular.net) }));
    geo = { W, H, xMax, X, Yp };

    const keep = keepAt(gross, r.regular.net);
    const raise = T.calculate(settings, gross + 50000).regular.net - r.regular.net;
    $('curveCaption').textContent = t('curveCaption', { raise: fmtEur(raise) });
    $('keepChip').textContent = t('keep', { keep });
    $('readout').innerHTML = t('readout', { gross: fmtEurC(gross), net: fmtEurC(r.regular.net), keep });
  }

  // Gross at the pointer, or null outside the plot area.
  function pointerGross(e) {
    const rect = svg.getBoundingClientRect();
    const x = (e.clientX - rect.left) * geo.W / rect.width;
    if (x < PL - 6 || x > geo.W - PR + 6) return null;
    const g = (x - PL) / (geo.W - PL - PR) * geo.xMax;
    return Math.min(geo.xMax, Math.max(0, Math.round(g / 1000) * 1000));
  }

  function showHover(e, g) {
    const c = T.calculate(settings, g);
    const hv = svg.querySelector('.hover');
    const x = geo.X(g), y = geo.Yp(c.regular.net);
    hv.classList.add('show');
    const line = hv.querySelector('line');
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('y1', PT); line.setAttribute('y2', geo.H - PB);
    hv.querySelector('circle').setAttribute('cx', x);
    hv.querySelector('circle').setAttribute('cy', y);
    const keep = keepAt(g, c.regular.net);
    const lines = [t('tipGross', { v: fmtEurC(g) }), t('tipNet', { v: fmtEurC(c.regular.net) })];
    if (settings.thirteenth || settings.summerBonus) lines.push(t('tipAvg', { v: fmtEurC(c.average.net) }));
    lines.push(t('tipKeep', { keep }));
    const tip = $('tip');
    tip.textContent = lines.join('\n');
    tip.hidden = false;
    $('readout').innerHTML = t('readout', { gross: fmtEurC(g), net: fmtEurC(c.regular.net), keep });
    // SVG elements have no offsetLeft: position from bounding boxes relative to the figure.
    const box = $('curveBox').getBoundingClientRect(), rect = svg.getBoundingClientRect();
    const scale = rect.width / geo.W;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(rect.left - box.left + x * scale, half), box.width - half) + 'px';
    tip.style.top = (rect.top - box.top + y * scale) + 'px';
  }

  function hideHover() {
    $('tip').hidden = true;
    const hv = svg.querySelector('.hover');
    if (hv) hv.classList.remove('show');
    if (lastResult) $('readout').innerHTML = t('readout', { gross: fmtEurC(lastGross), net: fmtEurC(lastResult.regular.net), keep: keepAt(lastGross, lastResult.regular.net) });
  }

  // Mouse: hover shows values, click applies. Touch: first tap shows values, a second tap within
  // 24 px applies, so scrolling past the chart never changes the salary.
  let touchPick = null;
  svg.addEventListener('pointermove', (e) => {
    if (!geo || e.pointerType === 'touch') return;
    const g = pointerGross(e);
    if (g === null) hideHover(); else showHover(e, g);
  });
  svg.addEventListener('pointerleave', hideHover);
  svg.addEventListener('click', (e) => {
    if (!geo) return;
    const g = pointerGross(e);
    if (g === null) return;
    if (e.pointerType === 'touch' && (touchPick === null || Math.abs(e.clientX - touchPick.x) > 24)) {
      showHover(e, g);
      touchPick = { x: e.clientX };
      return;
    }
    touchPick = null;
    hideHover();
    anchor = { field: 'monthlyGross', cents: g };
    render(null, { announce: true });
  });

  function render(activeEl, { quiet = false, announce = false } = {}) {
    lastGross = grossFromAnchor();
    const r = T.calculate(settings, lastGross);
    lastResult = r;
    const on = settings.thirteenth;
    const card = settings.benefitCard;
    const clamped = lastGross >= T.MAX_GROSS;

    for (const el of cells) {
      const pinned = el.dataset.field === anchor.field;
      boxOf(el).querySelector('.pin').hidden = !pinned;
      el.setAttribute('aria-label', cap(t('cell_' + el.dataset.field)) + (pinned ? `, ${t('pin').toLowerCase()}` : ''));
      if (el !== activeEl) setText(el, fmt(T.read(r, el.dataset.field)), quiet);
      const msg = msgOf(el);
      if (pinned && clamped) { msg.textContent = t('clamped', { max: fmtEur(T.MAX_GROSS) }); msg.hidden = false; }
      else if (el !== activeEl) msg.hidden = true;
    }
    setText($('novGross'), fmt(r.november.gross), quiet);
    setText($('novNet'), fmt(r.november.net), quiet);
    setText($('sumGross'), fmt(r.summerMonth.gross), quiet);
    setText($('sumNet'), fmt(r.summerMonth.net), quiet);
    $('barGross').textContent = fmtEurC(r.regular.gross);
    $('barNet').textContent = fmtEurC(r.regular.net);
    document.querySelectorAll('[data-bonus]').forEach((el) => { el.hidden = !on; });
    document.querySelectorAll('[data-summer]').forEach((el) => { el.hidden = !settings.summerBonus; });
    document.querySelectorAll('[data-extra]').forEach((el) => { el.hidden = !on && !settings.summerBonus; });
    $('summerRowLabel').textContent = monthName(settings.summerMonth);
    $('yearSub').textContent = settings.summerBonus ? t('yearSubPlus', { n: on ? 13 : 12 }) : t(on ? 'yearSub13' : 'yearSub12');
    $('benefitLine').hidden = card === 0;
    $('benefitLine').textContent = t('benefitLine', {
      month: fmtEurC(card), yearly: fmtEurC(card * 12),
      status: t(card > Y.SACHBEZUG_LIMIT ? 'benefitTaxed' : 'benefitFree'),
    });

    renderCurve();

    // Share bar: yearly net, taxes and contributions as parts of the yearly gross.
    const y = r.year;
    const tax = y.incomeTax + y.soli + y.church, social = y.health + y.care + y.pension + y.unemployment;
    const share = (v) => (y.gross ? v / y.gross * 100 : 0);
    document.querySelector('.bar .s-net').style.width = share(y.net) + '%';
    document.querySelector('.bar .s-tax').style.width = share(tax) + '%';
    document.querySelector('.bar .s-social').style.width = share(social) + '%';
    $('shareLegend').innerHTML = [['net', y.net], ['tax', tax], ['social', social]].map(([k, v]) =>
      `<li class="l-${k}">${t('share' + cap(k))} <b>${pct.format(share(v))} %</b></li>`).join('') + `<li>${t('shareOf')}</li>`;

    for (const [k] of ROWS) {
      const row = document.querySelector(`[data-row="${k}"]`);
      const values = {};
      for (const col of ['regular', 'summer', 'bonus', 'year']) values[col] = k === 'total' ? r[col].net + r[col].benefit : r[col][k];
      const empty = ['soli', 'church', 'care'].includes(k) && Object.values(values).every((v) => v === 0);
      row.hidden = empty || (k === 'church' && !settings.church) || (k === 'care' && settings.insurance === 'private')
        || ((k === 'benefit' || k === 'total') && card === 0);
      row.querySelector('th').textContent = t(k === 'health' && settings.insurance === 'private' ? 'row_healthPrivate' : 'row_' + k);
      const sign = ['gross', 'net', 'total'].includes(k) ? '' : k === 'benefit' ? '+' : '−';
      for (const col of ['regular', 'summer', 'bonus', 'year']) {
        const v = values[col];
        row.querySelector(`[data-col="${col}"]`).textContent = (v ? sign : '') + fmt(v);
      }
    }
    const notes = $('notes');
    notes.innerHTML = '';
    for (const n of r.notes) {
      const li = document.createElement('li');
      li.textContent = t('note_' + n.code, { limit: n.code === 'age64' ? n.limit : fmtEur(n.limit) });
      notes.appendChild(li);
    }

    const noKids = settings.children === 0;
    const c2 = form.querySelector('[name=taxClass][value="2"]');
    c2.disabled = noKids;
    c2.parentElement.classList.toggle('disabled', noKids);
    c2.setAttribute('aria-label', `${t('taxClass')} 2` + (noKids ? `. ${t('class2NeedsChild')}` : ''));
    $('taxClassHint').textContent = t('class' + settings.taxClass) + (noKids ? ` ${t('class2NeedsChild')}` : '');
    $('publicFields').hidden = settings.insurance !== 'public';
    $('privateFields').hidden = settings.insurance !== 'private';
    $('subsidyHint').textContent = t('subsidyHint', { amount: fmtEurC(T.pkvSubsidy(settings)) });
    $('summerFields').hidden = !settings.summerBonus;
    $('summerPercentField').hidden = settings.summerMode !== 'percent';
    $('summerAmountField').hidden = settings.summerMode !== 'fixed';
    $('summerHint').textContent = t('summerHint', { month: monthName(settings.summerMonth), amount: fmtEurC(r.summer.gross) });

    const state = T.STATES.find(([c]) => c === settings.state);
    $('printSummary').textContent = t('summary', {
      cls: settings.taxClass, state: lang === 'de' ? state[2] : state[1], age: settings.age,
      children: settings.children, church: t(settings.church ? 'yes' : 'no'),
      insurance: lang === 'en' ? t(settings.insurance).toLowerCase() : t(settings.insurance),
      thirteenth: t(on ? 'yes' : 'no'), card: fmtEurC(card),
      summer: !settings.summerBonus ? t('no') : `${settings.summerMode === 'percent' ? settings.summerPercent + ' %' : fmtEurC(settings.summerAmount)} (${monthName(settings.summerMonth)})`,
    });

    if (announce) {
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => {
        const f = (c) => (lang === 'de' ? money : moneyEn).format(c / 100);
        $('live').textContent = t('live', { mg: f(r.regular.gross), mn: f(r.regular.net), yg: f(r.year.gross), yn: f(r.year.net) });
      }, 800);
    }

    try { localStorage.setItem(STORE, JSON.stringify({ settings, anchor, lang })); } catch (e) { /* ignore */ }
    try { history.replaceState(null, '', '#' + T.encodeState({ settings, anchor, lang: null })); } catch (e) { /* ignore */ }
  }

  for (const el of cells) {
    el.addEventListener('focus', () => { editStart = { anchor: { ...anchor } }; el.select(); });
    el.addEventListener('input', () => {
      const cents = T.parseAmount(el.value);
      const bad = cents === null;
      el.setAttribute('aria-invalid', bad ? 'true' : 'false');
      boxOf(el).classList.toggle('invalid', bad);
      const msg = msgOf(el);
      msg.hidden = !bad;
      if (bad) { msg.textContent = t('invalidAmount'); return; }
      anchor = { field: el.dataset.field, cents };
      render(el, { announce: true });
    });
    el.addEventListener('blur', () => {
      el.removeAttribute('aria-invalid');
      boxOf(el).classList.remove('invalid');
      editStart = null;
      render(null);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); render(null, { quiet: true }); el.select(); }
      if (e.key === 'Escape' && editStart) { anchor = editStart.anchor; el.blur(); }
    });
  }
  form.addEventListener('change', () => { readForm(); writeForm(); render(null, { announce: true }); });
  form.addEventListener('input', (e) => { if (!e.target.classList.contains('text')) return; readForm(); render(null); });
  document.querySelectorAll('[name=lang]').forEach((radio) => radio.addEventListener('change', () => {
    lang = radio.value;
    applyLang();
    render(document.activeElement, { quiet: true });
  }));

  let copyTimer = 0;
  $('copyLink').addEventListener('click', async () => {
    const btn = $('copyLink'), label = $('copyLinkText');
    let ok = false;
    try { await navigator.clipboard.writeText(location.href); ok = true; } catch (e) { /* no clipboard access */ }
    label.textContent = t(ok ? 'linkCopied' : 'copyFailed');
    btn.classList.toggle('done', ok);
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { label.textContent = t('copyLink'); btn.classList.remove('done'); }, 2000);
  });

  let assumptionsWereOpen = false;
  window.addEventListener('beforeprint', () => { assumptionsWereOpen = $('assumptions').open; $('assumptions').open = true; });
  window.addEventListener('afterprint', () => { $('assumptions').open = assumptionsWereOpen; });

  // On phones, a compact gross/net bar follows the user while the hero is scrolled away.
  new IntersectionObserver(([entry]) => {
    $('stickyBar').classList.toggle('show', !entry.isIntersecting && entry.boundingClientRect.top < 0);
  }).observe($('hero'));

  let resizeFrame = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => { if (lastResult) renderCurve(); });
  }).observe($('curveBox'));

  applyLang();
  writeForm();
  render(null, { quiet: true });
})();
</script>
</body>
</html>
